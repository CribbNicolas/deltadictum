name: CI

on:
  pull_request:
    branches: [main]
  # Pushes to main run this through publish.yml.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run lint

  # Job names are kept stable: branch protection may require them by name.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Concurrent hook processes claiming the same memories: Linux runners only,
      # where process start-up does not make the run a measure of the runner.
      - if: runner.os == 'Linux'
        run: npm run test:stress

  # The oldest Node that package.json accepts (node:sqlite with FTS5 arrived in
  # 22.16.0) and the current LTS.
  node:
    name: test (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # macOS is handled in code (src/engine/clause.cjs) but has never run on a Mac; this job
  # reports how it fares without blocking a merge.
  macos:
    name: test (macos-latest, advisory)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check the published file list
        run: node .github/scripts/check-pack.mjs
      - run: npm ci --ignore-scripts
      # DD has no runtime dependency today, and npm refuses to audit an empty tree;
      # the check runs again as soon as package.json declares one.
      - name: Verify registry signatures of the dependency tree
        run: |
          if node -e "process.exit(Object.keys(require('./package.json').dependencies ?? {}).length ? 0 : 1)"; then
            npm audit signatures
          else
            echo "No dependencies to verify."
          fi

  version:
    # Dependabot PRs carry no release; a skipped required check counts as passed.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Require a version bump over main, with a changelog entry
        run: node .github/scripts/check-version.mjs origin/${{ github.base_ref }}
