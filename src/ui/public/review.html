<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DD review</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f9; --panel: #ffffff; --hover: #eeeef3; --border: #dcdce4;
      --fg: #18181f; --muted: #66667a; --accent: #3b5bdb; --accent-fg: #ffffff; --brand: #b7791f;
      --danger: #b42318; --danger-bg: #fdecea; --danger-border: #f3b8b2;
      --ok: #146c43; --ok-bg: #e6f4ea; --ok-border: #a6d9b8;
      --warn: #8a5a00; --warn-bg: #fff4dc; --warn-border: #f0d08c;
      --c1: #3b5bdb; --c2: #b7791f; --c3: #146c43; --c4: #a3a3b5; --c5: #b42318; --c6: #d6d6e0; --track: #ececf2;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", "Segoe UI Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0b0f; --panel: #14141a; --hover: #1b1b22; --border: #26262f;
        --fg: #e9e9ee; --muted: #8f8fa3; --accent: #7c9cff; --accent-fg: #0b0b0f; --brand: #e8b84a;
        --danger: #ff9b9b; --danger-bg: #341717; --danger-border: #5c2a2a;
        --ok: #7fe0b3; --ok-bg: #12321f; --ok-border: #1c4a2c;
        --warn: #f0c674; --warn-bg: #201a10; --warn-border: #4a3a1c;
        --c1: #7c9cff; --c2: #e8b84a; --c3: #7fe0b3; --c4: #5c5c6e; --c5: #ff9b9b; --c6: #3d3d4c; --track: #1f1f28;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); overflow: hidden; }
    main { height: 100%; display: grid; grid-template-columns: 220px 330px minmax(0, 1fr); }
    main.full { grid-template-columns: 220px minmax(0, 1fr); }
    main.full #list, main.full #detail { display: none; }
    main:not(.full) #view { display: none; }
    nav { min-height: 0; overflow-y: auto; border-right: 1px solid var(--border); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; background: var(--panel); }
    nav button { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: none;
      border-radius: 7px; background: transparent; color: var(--fg); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
    nav button:hover { background: var(--hover); }
    nav button[aria-current="true"] { background: var(--accent); color: var(--accent-fg); }
    nav .count { font-family: var(--mono); font-size: 11.5px; opacity: 0.8; }
    nav .count.zero { opacity: 0.4; }
    nav hr { border: none; border-top: 1px solid var(--border); margin: 8px 2px; }
    .foot { margin-top: auto; padding: 12px 4px 2px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .foot .name { font-weight: 600; font-size: 13px; }
    .foot .live { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); }
    .foot .live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--c4); }
    .foot .live.on::before { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
    .foot .gear { margin-left: auto; width: 34px; height: 34px; padding: 0; justify-content: center; border: 1px solid var(--border); }
    #content { min-height: 0; display: contents; }
    #msg { position: fixed; top: 10px; right: 16px; z-index: 5; max-width: min(560px, calc(100vw - 32px)); }
    #msg:empty { display: none; }
    #list { min-height: 0; overflow-y: auto; border-right: 1px solid var(--border); }
    #view { min-height: 0; overflow-y: auto; }
    .item { display: block; width: 100%; padding: 10px 14px; border: none; border-bottom: 1px solid var(--border); border-left: 3px solid transparent;
      background: transparent; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
    .item:hover { background: var(--hover); }
    .item.active { background: var(--panel); border-left-color: var(--accent); }
    .item .meta, .mono { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
    .item .meta { display: block; margin-top: 3px; }
    .empty { padding: 28px 16px; color: var(--muted); text-align: center; }
    #detail { min-height: 0; overflow-y: auto; }
    .bar { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 20px;
      border-bottom: 1px solid var(--border); background: var(--panel); }
    .pane { padding: 16px 20px 40px; max-width: 980px; }
    h2 { font-size: 16px; margin: 0 0 4px; overflow-wrap: anywhere; }
    h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); margin: 22px 0 6px; }
    .section { padding: 14px 14px 4px; margin: 0; }
    label { display: block; margin: 14px 0 5px; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px; }
    input, textarea, select { width: 100%; background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 7px;
      padding: 8px 10px; font: inherit; font-size: 13.5px; }
    .bar input, .bar select { width: auto; flex: 0 1 180px; min-width: 0; }
    textarea { min-height: 40px; resize: vertical; }
    textarea.json { font-family: var(--mono); font-size: 12px; line-height: 1.5; }
    button.act { height: 32px; padding: 0 13px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel); color: var(--fg);
      font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
    button.act:hover { background: var(--hover); }
    button.act:disabled { opacity: 0.5; cursor: default; }
    body[aria-busy="true"] { cursor: progress; }
    body[aria-busy="true"] button.act { pointer-events: none; opacity: 0.6; }
    button.ok { border-color: var(--ok-border); background: var(--ok-bg); color: var(--ok); }
    button.danger { border-color: var(--danger-border); background: var(--danger-bg); color: var(--danger); }
    button.small { height: 26px; padding: 0 9px; font-size: 12px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .badge { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--border);
      background: var(--panel); letter-spacing: 0.3px; margin-right: 4px; }
    .badge.warn { border-color: var(--warn-border); background: var(--warn-bg); color: var(--warn); }
    .badge.bad { border-color: var(--danger-border); background: var(--danger-bg); color: var(--danger); }
    .badge.good { border-color: var(--ok-border); background: var(--ok-bg); color: var(--ok); }
    .notice { margin: 10px 0; padding: 10px 12px; border-radius: 7px; border-left: 3px solid var(--accent); background: var(--panel); white-space: pre-wrap; font-size: 13px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); }
    .pane .notice { box-shadow: none; }
    .notice.error { border-color: var(--danger); background: var(--danger-bg); color: var(--danger); }
    .notice.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
    .notice ul { margin: 4px 0 0; padding-left: 18px; }
    ul.plain { list-style: none; margin: 0; padding: 0; }
    ul.plain li { padding: 6px 0; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    ul.plain li:first-child { border-top: none; }
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 10px;
      font-family: var(--mono); font-size: 12px; }
    table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
    th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
    th { color: var(--muted); font-weight: 500; }
    .request { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .request p { margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .row input { flex: 1 1 260px; width: auto; min-width: 0; }

    /* Dashboard */
    .dash { padding: 22px 24px 48px; max-width: 1280px; }
    .dash-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 18px; }
    .dash-head h2 { font-size: 20px; margin: 0; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
    .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
    .tile .label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .tile .value { font-size: 26px; font-weight: 650; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
    .tile .note { font-size: 12px; color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; margin-top: 12px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 16px; min-width: 0; }
    .card h3 { margin: 0 0 12px; }
    .card.wide { grid-column: 1 / -1; }
    .stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--track); }
    .stack span { height: 100%; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    .bars { display: grid; grid-template-columns: minmax(80px, max-content) 1fr auto; gap: 7px 10px; align-items: center; font-size: 12.5px; }
    .bars .track { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
    .bars .fill { height: 100%; border-radius: 5px; background: var(--c1); }
    .bars .num { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
    .bars .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
    .bars button.who { border: none; background: none; padding: 0; color: var(--accent); font: inherit; text-align: left; cursor: pointer; }
    .ring { display: flex; align-items: center; gap: 16px; }
    .ring .big { font-size: 22px; font-weight: 650; }
    svg text { fill: var(--muted); font: 11px var(--mono); }
    .conflicts { margin-top: 12px; }

    /* Settings */
    dialog { width: min(560px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius: 14px; padding: 0; background: var(--panel); color: var(--fg);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35); }
    dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
    dialog .pane { padding: 20px 22px 8px; }
    dialog .actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 22px 18px; }
    .check { display: flex; gap: 10px; align-items: flex-start; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--fg); }
    .check input { width: auto; margin-top: 3px; }

    @media (max-width: 900px) {
      body { overflow: auto; }
      main, main.full { height: auto; grid-template-columns: 1fr; }
      nav, #list { border-right: none; border-bottom: 1px solid var(--border); }
      /* On a phone the views are one scrolling row, so the content starts on the first screen. */
      nav { flex-direction: row; overflow-x: auto; overflow-y: hidden; gap: 4px; padding: 8px; position: sticky; top: 0; z-index: 3; }
      nav button { width: auto; flex: 0 0 auto; white-space: nowrap; }
      nav hr { border-top: none; border-left: 1px solid var(--border); margin: 4px 2px; }
      .foot { margin: 0 0 0 4px; padding: 0 0 0 8px; border-top: none; border-left: 1px solid var(--border); flex: 0 0 auto; }
      #list { max-height: 320px; }
      #detail, #view { overflow: visible; }
      .dash { padding: 16px; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="msg"></div>
  <main id="main">
    <nav id="queues" aria-label="Views"></nav>
    <section id="list" aria-label="Memories"></section>
    <section id="detail" aria-live="polite"><p class="empty">Select a memory, or a request.</p></section>
    <section id="view" aria-live="polite"></section>
  </main>
  <dialog id="settings" aria-labelledby="settings-title"></dialog>
  <script nonce="__NONCE__">
  'use strict';
  // Every string from the store reaches the DOM through text nodes or attributes,
  // never as markup; every handler is attached here (the CSP allows no other script).
  const SECTIONS = [
    [['dashboard', 'Dashboard'], ['create', '+ New memory']],
    [['candidates', 'Candidates'], ['from_agent', 'Agent requests'], ['auto_accepted', 'Accepted by DD']],
    [['activity', 'Recent deliveries'], ['all', 'All memories'], ['stale', 'Stale evidence'], ['hubs', 'Hubs'], ['dead', 'Dead triggers'],
      ['false_alarms', 'Suspected false alarms'], ['duplicates', 'Duplicates'], ['missing_not_derivable', 'Missing not_derivable']],
  ];
  const LABELS = Object.fromEntries(SECTIONS.flat());
  // Views that take the whole width: no list of memories beside them.
  const FULL = new Set(['dashboard', 'create']);
  const KINDS = ['decision', 'trap', 'failed_approach', 'fact', 'procedure'];
  const state = { queue: 'candidates', selected: null, overview: null, rows: [], live: false };
  const $ = id => document.getElementById(id);

  function h(tag, props = {}, ...children) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (value === null || value === undefined || value === false) continue;
      if (key === 'on') for (const [event, fn] of Object.entries(value)) el.addEventListener(event, fn);
      else if (key === 'class') el.className = value;
      else if (key === 'value') el.value = value;
      else if (key === 'style') Object.assign(el.style, value);
      else el.setAttribute(key, value === true ? '' : String(value));
    }
    for (const child of children.flat(Infinity)) {
      if (child === null || child === undefined || child === false) continue;
      el.append(child instanceof Node ? child : String(child));
    }
    return el;
  }

  // SVG elements, for the charts: attributes only, text as text nodes.
  function s(tag, attrs = {}, ...children) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [key, value] of Object.entries(attrs)) if (value !== null && value !== undefined) el.setAttribute(key, String(value));
    for (const child of children.flat(Infinity)) if (child !== null && child !== undefined && child !== false) el.append(child instanceof Node ? child : String(child));
    return el;
  }

  async function api(path, { method = 'GET', body } = {}) {
    const init = { method, credentials: 'same-origin', headers: {} };
    if (method !== 'GET') { init.headers['content-type'] = 'application/json'; init.body = JSON.stringify(body ?? {}); }
    const res = await fetch(path, init);
    let data = null;
    try { data = await res.json(); } catch { data = null; }
    if (!res.ok) {
      const err = new Error(data?.error ?? `HTTP ${res.status}`);
      err.problems = data?.problems ?? [data?.message ?? data?.error ?? `HTTP ${res.status}`];
      throw err;
    }
    return data;
  }

  let sayTimer = null;
  function say(kind, text, problems = []) {
    clearTimeout(sayTimer);
    $('msg').replaceChildren(h('div', { class: `notice ${kind}`, role: kind === 'error' ? 'alert' : 'status' },
      text, problems.length ? h('ul', {}, problems.map(p => h('li', { class: 'mono' }, p))) : null));
    if (kind === 'ok') sayTimer = setTimeout(quiet, 4000);
  }
  const quiet = () => $('msg').replaceChildren();
  const refused = (what, err) => say('error', `${what} refused.`, err.problems ?? [err.message]);

  const memoryPath = id => `/api/memories/${encodeURIComponent(id)}`;
  const memoryAction = (id, action) => `${memoryPath(id)}${action}`;
  const pretty = value => JSON.stringify(value ?? null, null, 2);

  function parseJson(text, field) {
    if (!text.trim()) return { value: undefined };
    try { return { value: JSON.parse(text) }; } catch { return { error: `${field}: not valid JSON` }; }
  }

  function grow(area) { area.style.height = 'auto'; area.style.height = `${Math.min(area.scrollHeight + 2, 600)}px`; }
  function textArea(id, value, json = false) {
    const area = h('textarea', { id, class: json ? 'json' : null, spellcheck: json ? 'false' : null, value, on: { input: e => grow(e.target) } });
    requestAnimationFrame(() => grow(area));
    return area;
  }

  // Navigation: what to look at first, what waits for a person, what the store holds.
  async function loadOverview() {
    try { state.overview = await api('/api/overview'); } catch (err) { refused('Reading the overview', err); return; }
    renderNav();
  }

  function renderNav() {
    const queues = state.overview?.queues ?? {};
    const countOf = view => (view === 'activity' ? (state.overview?.recent?.length ?? 0) : FULL.has(view) ? '' : queues[view] ?? 0);
    const button = ([view, label]) => h('button', { type: 'button', 'aria-current': state.queue === view ? 'true' : 'false', on: { click: () => select(view) } },
      h('span', {}, label), h('span', { class: `count${countOf(view) ? '' : ' zero'}` }, countOf(view)));
    const mark = s('svg', { width: 22, height: 22, viewBox: '0 0 128 128', 'aria-hidden': 'true' },
      s('g', { fill: 'none', stroke: 'var(--brand)', 'stroke-width': 12, 'stroke-linejoin': 'round' },
        s('circle', { cx: 64, cy: 64, r: 36 }), s('line', { x1: 64, y1: 28, x2: 64, y2: 100, 'stroke-linecap': 'square' })));
    const gear = s('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'aria-hidden': 'true' },
      s('circle', { cx: 12, cy: 12, r: 3 }),
      s('path', { d: 'M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z' }));
    const sections = SECTIONS.map(section => section.map(button));
    $('queues').replaceChildren(...sections[0], h('hr'), ...sections[1], h('hr'), ...sections[2],
      h('div', { class: 'foot' }, mark, h('span', { class: 'name' }, 'DD'),
        h('span', { class: `live${state.live ? ' on' : ''}`, title: state.live ? 'Updates as the store changes' : 'Not receiving updates: reload to see changes' }, state.live ? 'live' : 'offline'),
        h('button', { type: 'button', class: 'gear', 'aria-label': 'Settings', title: 'Settings', on: { click: showSettings } }, gear)));
  }

  function select(view) {
    state.queue = view;
    // The view is in the address, so a reload or a shared link opens it again.
    if (location.hash !== `#${view}`) history.replaceState(null, '', `#${view}`);
    state.selected = null;
    quiet();
    renderNav();
    $('main').classList.toggle('full', FULL.has(view));
    if (!FULL.has(view)) showEmpty();
    loadView();
  }

  async function loadView() {
    if (state.queue === 'dashboard') return loadDashboard();
    if (state.queue === 'create') return showCreate();
    return loadList();
  }

  async function loadList() {
    const list = $('list');
    if (state.queue === 'from_agent') return loadFromAgent();
    if (state.queue === 'activity') return loadActivity();
    let rows;
    try { rows = await api(`/api/memories?queue=${encodeURIComponent(state.queue)}`); } catch (err) { refused('Reading the queue', err); return; }
    state.rows = rows;
    if (!rows.length) { list.replaceChildren(h('p', { class: 'empty' }, `Nothing in ${LABELS[state.queue]}.`)); return; }
    list.replaceChildren(...rows.map(row => h('button', {
      type: 'button', class: `item${row.id === state.selected ? ' active' : ''}`, 'data-id': row.id, on: { click: () => { quiet(); openMemory(row.id); } },
    }, h('div', {}, row.title),
    h('span', { class: 'meta' }, `${row.topic} · ${row.kind} · ${row.status}`),
    row.signals.length ? h('span', { class: 'meta' }, row.signals.map(s => s.signal).join(', ')) : null)));
  }

  function markActive() {
    for (const item of $('list').querySelectorAll('.item')) item.classList.toggle('active', item.dataset.id === state.selected);
  }

  function showEmpty() { $('detail').replaceChildren(h('p', { class: 'empty' }, 'Select a memory, or a request.')); }

  // The last deliveries the roll-up saw: which memory, at which event, by which
  // dimension, in which session. A hub shows here before it shows in a count.
  function loadActivity() {
    const recent = state.overview?.recent ?? [];
    if (!recent.length) { $('list').replaceChildren(h('p', { class: 'empty' }, 'No delivery rolled up yet.')); return; }
    $('list').replaceChildren(...recent.map(fire => h('button', { type: 'button', class: 'item', on: { click: () => { quiet(); openMemory(fire.memory); } } },
      h('div', {}, fire.title ?? fire.memory),
      h('span', { class: 'meta' }, [fire.at, fire.kind, fire.via, fire.session].filter(Boolean).join(' · ')))));
  }

  // Dashboard: the store, the review queues, use and capture, as the roll-up last saw them. Counts only, never content.
  async function loadDashboard() {
    let d;
    try { [d] = await Promise.all([api('/api/dashboard'), state.overview ? null : loadOverview()]); } catch (err) { refused('Reading the dashboard', err); return; }
    const o = state.overview;
    if (!o) return;
    const st = o.status;
    const tile = (label, value, note) => h('div', { class: 'tile' }, h('div', { class: 'label' }, label), h('div', { class: 'value' }, String(value)), note ? h('div', { class: 'note' }, note) : null);
    const card = (title, wide, ...body) => h('section', { class: `card${wide ? ' wide' : ''}` }, h('h3', {}, title), ...body);
    const pct = (n, total) => (total && n ? `${Math.max(2, Math.round(n / total * 100))}%` : '0%');
    // Horizontal bars, one row per entry: label, bar, number.
    const bars = (entries, color = 'var(--c1)') => {
      if (!entries.length) return h('p', { class: 'mono' }, 'Nothing rolled up yet.');
      const max = Math.max(...entries.map(e => e.value), 1);
      return h('div', { class: 'bars' }, entries.map(e => [
        e.open ? h('button', { type: 'button', class: 'who', title: e.label, on: { click: e.open } }, e.label) : h('span', { class: 'who', title: e.label }, e.label),
        h('div', { class: 'track' }, h('div', { class: 'fill', style: { width: pct(e.value, max), background: e.color ?? color } })),
        h('span', { class: 'num' }, String(e.value))]));
    };

    const STATUS = [['active', 'var(--c3)'], ['contested', 'var(--c5)'], ['candidate', 'var(--c2)'], ['archived', 'var(--c4)'], ['superseded', 'var(--c6)']];
    const byStatus = st.by_status ?? {};
    const known = STATUS.map(([name]) => name);
    const statusRows = [...STATUS, ...Object.keys(byStatus).filter(name => !known.includes(name)).map(name => [name, 'var(--c1)'])]
      .filter(([name]) => byStatus[name]);
    const statusCard = card('Memories by status', false,
      h('div', { class: 'stack', role: 'img', 'aria-label': statusRows.map(([name]) => `${byStatus[name]} ${name}`).join(', ') },
        statusRows.map(([name, color]) => h('span', { title: `${byStatus[name]} ${name}`, style: { width: `${byStatus[name] / Math.max(st.total, 1) * 100}%`, background: color } }))),
      h('div', { class: 'legend' }, statusRows.map(([name, color]) => h('span', {}, h('i', { style: { background: color } }), `${name} ${byStatus[name]}`))));

    // Sessions and deliveries per day, as paired columns.
    const days = d.by_day;
    let dayChart = h('p', { class: 'mono' }, 'Nothing rolled up yet.');
    if (days.length) {
      const W = 560, H = 180, pad = 22, top = Math.max(...days.flatMap(r => [r.sessions, r.deliveries]), 1);
      const slot = (W - pad) / days.length, bw = Math.min(18, slot / 3);
      const y = v => H - pad - (v / top) * (H - pad - 22);
      dayChart = s('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', role: 'img', 'aria-label': days.map(r => `${r.day}: ${r.sessions} sessions, ${r.deliveries} deliveries`).join('; ') },
        s('line', { x1: pad, y1: H - pad, x2: W, y2: H - pad, stroke: 'var(--border)' }),
        days.map((r, i) => {
          const x = pad + i * slot + slot / 2;
          return s('g', {},
            s('rect', { x: x - bw - 1, y: y(r.sessions), width: bw, height: H - pad - y(r.sessions), rx: 3, fill: 'var(--c1)' }, s('title', {}, `${r.sessions} sessions`)),
            s('rect', { x: x + 1, y: y(r.deliveries), width: bw, height: H - pad - y(r.deliveries), rx: 3, fill: 'var(--c2)' }, s('title', {}, `${r.deliveries} deliveries`)),
            r.sessions ? s('text', { x: x - bw / 2 - 1, y: y(r.sessions) - 4, 'text-anchor': 'middle' }, String(r.sessions)) : null,
            r.deliveries ? s('text', { x: x + bw / 2 + 1, y: y(r.deliveries) - 4, 'text-anchor': 'middle' }, String(r.deliveries)) : null,
            s('text', { x, y: H - 6, 'text-anchor': 'middle' }, r.day.slice(5)));
        }));
    }
    const dayCard = card('Last days', false, dayChart,
      h('div', { class: 'legend' }, h('span', {}, h('i', { style: { background: 'var(--c1)' } }), 'sessions'), h('span', {}, h('i', { style: { background: 'var(--c2)' } }), 'deliveries')));

    // Coverage: of the live memories, how many were ever delivered.
    const live = d.coverage.live, ever = d.coverage.delivered_ever, share = live ? ever / live : 0, R = 34, C = 2 * Math.PI * R;
    const coverageCard = card('Coverage', false, h('div', { class: 'ring' },
      s('svg', { width: 88, height: 88, viewBox: '0 0 88 88', role: 'img', 'aria-label': `${ever} of ${live} live memories delivered at least once` },
        s('circle', { cx: 44, cy: 44, r: R, fill: 'none', stroke: 'var(--track)', 'stroke-width': 10 }),
        s('circle', { cx: 44, cy: 44, r: R, fill: 'none', stroke: 'var(--c3)', 'stroke-width': 10, 'stroke-linecap': 'round',
          'stroke-dasharray': `${C * share} ${C}`, transform: 'rotate(-90 44 44)' })),
      h('div', {}, h('div', { class: 'big' }, `${Math.round(share * 100)}%`),
        h('div', { class: 'mono' }, `${ever} of ${live} live memories delivered at least once`),
        h('div', { class: 'mono' }, `${d.coverage.never_fired_with_opportunity} never fired with the chance · ${d.coverage.no_opportunity} never had it`))));

    const c = d.capture;
    const captureCard = card('Capture', false, bars([
      { label: 'asked to save', value: c.asked, color: 'var(--c1)' }, { label: 'corrections', value: c.corrections, color: 'var(--c1)' },
      { label: 'proposals', value: c.proposals, color: 'var(--c2)' }, { label: 'active', value: c.active, color: 'var(--c3)' },
      { label: 'candidates', value: c.candidates, color: 'var(--c2)' }, { label: 'rejected', value: c.rejected, color: 'var(--c5)' },
      { label: 'agent requests', value: c.requests, color: 'var(--c4)' }]));

    const dv = d.deliveries;
    const conflicts = st.conflicts ?? [];
    $('view').replaceChildren(h('div', { class: 'dash' },
      h('div', { class: 'dash-head' }, h('h2', {}, 'Dashboard'),
        h('span', { class: 'mono' }, `${st.total} memories · ${Object.entries(byStatus).map(([name, n]) => `${n} ${name}`).join(' · ')}`)),
      h('div', { class: 'tiles' },
        tile('Live memories', live, `${ever} delivered at least once`),
        tile('Waiting for you', (o.queues.candidates ?? 0) + (o.queues.from_agent ?? 0), `${o.queues.candidates ?? 0} candidates · ${o.queues.from_agent ?? 0} from the agent`),
        tile('Sessions', d.sessions.total, `${d.sessions.with_deliveries} with a delivery`),
        tile('Deliveries', dv.total, `${dv.per_100_tool_calls} per 100 tool calls`),
        tile('Characters per delivery', dv.chars_avg, `max ${dv.chars_max} of a cap of ${d.limit}; cap reached ${Math.round(dv.capped_share * 100)}%`),
        tile('Checks', d.checks.fixed + d.checks.ignored + d.checks.repeated, `fixed ${d.checks.fixed} · ignored ${d.checks.ignored} · repeated ${d.checks.repeated}`)),
      conflicts.length ? h('div', { class: 'notice error conflicts' }, `Topics with more than one live memory: ${conflicts.map(x => x.topic).join(', ')}`) : null,
      h('div', { class: 'cards' },
        statusCard, coverageCard, dayCard, captureCard,
        card('Fires by trigger', false, bars(Object.entries(d.by_via).map(([label, value]) => ({ label, value })), 'var(--c2)')),
        card('Deliveries by event', false, bars(Object.entries(d.by_kind).map(([label, value]) => ({ label, value })), 'var(--c1)')),
        card('Memories that fire most', true, bars(d.top.map(row => ({ label: row.title, value: row.fires, open: () => openAnywhere(row.memory) })), 'var(--c3)')))));
  }

  // What the agent asked: the batches it named, accepted or rejected whole, then the requests no batch names.
  async function loadFromAgent() {
    let batches, requests;
    try { [batches, requests] = await Promise.all([api('/api/batches'), api('/api/requests')]); } catch (err) { refused('Reading the agent\'s requests', err); return; }
    const loose = requests.filter(request => typeof request.batch !== 'string');
    if (!batches.length && !loose.length) { $('list').replaceChildren(h('p', { class: 'empty' }, 'Nothing the agent asked waits.')); return; }
    $('list').replaceChildren(
      batches.length ? h('h3', { class: 'section' }, 'Batches') : null,
      ...batches.map(batch => h('div', { class: 'request' },
        h('div', {}, h('span', { class: 'badge warn' }, 'batch'), h('span', { class: 'mono' }, batch.name),
          h('span', { class: 'mono' }, ` ${batch.candidates.length} memories, ${batch.requests.length} requests`)),
        h('ul', { class: 'plain' },
          ...batch.candidates.map(c => h('li', {}, h('button', { type: 'button', class: 'act small', on: { click: () => openMemory(c.id) } }, 'Open'),
            h('span', { class: 'badge' }, c.kind), ` ${c.title} `, h('span', { class: 'mono' }, c.topic))),
          ...batch.requests.map(r => h('li', {}, h('span', { class: 'badge' }, r.request), h('span', { class: 'mono' }, ` ${requestWhat(r)} `), r.why, requestTargets(r)))),
        h('div', { class: 'row' },
          h('button', { type: 'button', class: 'act small ok', on: { click: () => actBatch(batch.name, 'accept') } }, 'Accept all'),
          h('button', { type: 'button', class: 'act small danger', on: { click: () => actBatch(batch.name, 'reject') } }, 'Reject all')))),
      loose.length ? h('h3', { class: 'section' }, 'Requests') : null,
      ...loose.map(request => h('div', { class: 'request' },
        h('div', {}, h('span', { class: 'badge warn' }, request.request), h('span', { class: 'mono' }, requestWhat(request))),
        h('p', {}, request.why),
        requestTargets(request),
        h('span', { class: 'mono' }, request.at ?? ''),
        h('div', { class: 'row' },
          request.targets ? null : h('button', { type: 'button', class: 'act small', on: { click: () => openTarget(request.target) } }, 'Open memory'),
          APPLIED_REQUESTS.includes(request.request)
            ? h('button', { type: 'button', class: 'act small ok', on: { click: () => applyRequest(request.id) } }, 'Apply') : null,
          h('button', { type: 'button', class: 'act small', on: { click: () => closeRequest(request.id, 'done') } }, 'Done'),
          h('button', { type: 'button', class: 'act small', on: { click: () => closeRequest(request.id, 'dismissed') } }, 'Dismiss')))));
  }

  async function actBatch(name, outcome) {
    let result;
    try { result = await api(`/api/batches/${encodeURIComponent(name)}/${outcome}`, { method: 'POST' }); }
    catch (err) { refused(`${outcome === 'accept' ? 'Accepting' : 'Rejecting'} the batch`, err); return; }
    const notes = [];
    if (result.refused.length) notes.push(`refused: ${result.refused.map(r => `${r.target ?? r.id} (${r.problems.join(', ')})`).join('; ')}`);
    if (result.left.length) notes.push(`left for a person: ${result.left.map(r => `${r.id} (${r.reason})`).join('; ')}`);
    say(notes.length ? 'error' : 'ok', `Batch ${name}: ${result.accepted.length + result.rejected.length} memories, ${result.closed.length} requests${notes.length ? `. ${notes.join('. ')}` : '.'}`);
    await Promise.all([loadOverview(), loadList()]);
  }

  async function openTarget(target) {
    try {
      const all = await api('/api/memories?queue=all');
      const found = all.find(m => m.id === target) ?? all.find(m => m.topic === target && m.status !== 'superseded' && m.status !== 'archived')
        ?? all.find(m => m.topic === target);
      if (!found) { showEmpty(); say('error', `No memory has the id or topic ${target}.`); return; }
      openMemory(found.id);
    } catch (err) { refused('Opening the memory', err); }
  }

  // The requests the page can carry out as asked; a revise is the person's to write.
  const APPLIED_REQUESTS = ['archive', 'merge', 'reverify', 'delete'];
  const requestWhat = r => `${r.targets ? `${r.targets.length} memories` : r.target}${r.into ? ` into ${r.into}` : ''}`;
  const requestTargets = r => (r.targets ? h('details', {}, h('summary', {}, 'Memories'), h('p', { class: 'mono' }, r.targets.join(', '))) : null);

  async function applyRequest(id) {
    let result;
    try { result = await api(`/api/requests/${encodeURIComponent(id)}/apply`, { method: 'POST' }); }
    catch (err) { refused('Carrying out the request', err); return; }
    const notes = result.refused.map(r => `${r.target} (${r.problems.join(', ')})`);
    say(notes.length ? 'error' : 'ok', `Done for ${result.done.length} ${result.done.length === 1 ? 'memory' : 'memories'}${notes.length ? `; refused: ${notes.join('; ')}` : '.'}`);
    await Promise.all([loadOverview(), loadList()]);
  }

  async function closeRequest(id, outcome) {
    try { await api(`/api/requests/${encodeURIComponent(id)}/${outcome === 'done' ? 'done' : 'dismissed'}`, { method: 'POST' }); }
    catch (err) { refused('Closing the request', err); return; }
    await Promise.all([loadOverview(), loadList()]);
  }

  // A memory opened from a whole-width view lands in All memories, beside the list.
  async function openAnywhere(id) {
    if (FULL.has(state.queue)) { select('all'); }
    await openMemory(id);
  }

  // One memory: what it is, what it would do, and what a person can do to it.
  async function openMemory(id) {
    state.selected = id;
    markActive();
    let detail;
    try { detail = await api(memoryPath(id)); } catch (err) { showEmpty(); refused('Reading the memory', err); return; }
    renderDetail(detail);
  }

  // A write recompiles and the views recompute health: about a second. The page
  // says it is busy and takes no second click meanwhile.
  async function act(label, path, body, { method = 'POST', after = 'reopen' } = {}) {
    document.body.setAttribute('aria-busy', 'true');
    try {
      try { await api(path, { method, body }); } catch (err) { refused(label, err); return false; }
      await Promise.all([loadOverview(), loadList()]);
      if (after === 'reopen' && state.selected) await openMemory(state.selected);
      else { state.selected = null; showEmpty(); }
      say('ok', `${label}: done.`);
      return true;
    } finally { document.body.removeAttribute('aria-busy'); }
  }

  function renderDetail(detail) {
    const m = detail.memory;
    const id = m.id;
    const reason = h('input', { type: 'text', placeholder: 'Reason (optional)', 'aria-label': 'Reason' });
    const topic = h('input', { type: 'text', value: m.topic, 'aria-label': 'Topic' });
    const keep = h('input', { type: 'text', placeholder: 'Keep memory id', 'aria-label': 'Memory to merge into' });
    const remove = h('button', { type: 'button', class: 'act danger' }, 'Delete');
    remove.addEventListener('click', () => {
      if (remove.dataset.armed) { act('Delete', memoryPath(id), {}, { method: 'DELETE', after: 'clear' }); return; }
      remove.dataset.armed = '1';
      remove.textContent = 'Confirm delete';
      setTimeout(() => { delete remove.dataset.armed; remove.textContent = 'Delete'; }, 4000);
    });
    const live = m.status === 'active' || m.status === 'contested';
    // A status change acts on the stored memory: unsaved edits are saved first, so
    // what the person sees is what gets accepted, archived or restored.
    const change = (label, action, body = () => ({})) => async () => {
      if (edited() && !(await save())) return;
      await act(label, memoryAction(id, action), body());
    };
    const bar = h('div', { class: 'bar' },
      m.status === 'candidate' ? h('button', { type: 'button', class: 'act ok', on: { click: change('Accept', '/accept') } }, 'Accept') : null,
      m.status === 'candidate' ? h('button', { type: 'button', class: 'act danger', on: { click: change('Reject', '/reject', () => ({ reason: reason.value })) } }, 'Reject') : null,
      live ? h('button', { type: 'button', class: 'act', on: { click: change('Archive', '/archive', () => ({ reason: reason.value })) } }, 'Archive') : null,
      m.status === 'archived' ? h('button', { type: 'button', class: 'act ok', on: { click: change('Restore', '/restore') } }, 'Restore') : null,
      // DD accepted it on its own: a person who read it says so, and it leaves that queue.
      live && m.review?.accepted?.by === 'dd' ? h('button', { type: 'button', class: 'act', on: { click: change('Mark as reviewed', '/reviewed') } }, 'Mark as reviewed') : null,
      // Evidence files changed since the memory was written: a person who judged the claim still holds re-anchors them.
      live && detail.stale.length ? h('button', { type: 'button', class: 'act', on: { click: change('Re-verify evidence', '/reverify') } }, 'Re-verify evidence') : null,
      m.status === 'candidate' || live ? reason : null,
      h('button', { type: 'button', class: 'act ok', on: { click: save } }, 'Save'),
      remove);

    const kind = h('select', { id: 'f-kind' }, KINDS.map(k => h('option', { value: k, selected: k === m.kind }, k)));
    const fields = {
      title: h('input', { id: 'f-title', type: 'text', value: m.title }),
      body: textArea('f-body', m.body),
      not_derivable: textArea('f-nd', m.not_derivable ?? ''),
      triggers: textArea('f-triggers', pretty(m.triggers), true),
      check: textArea('f-check', m.check ? pretty(m.check) : '', true),
    };
    const values = () => JSON.stringify([kind.value, ...Object.values(fields).map(field => field.value)]);
    const stored = values();
    const edited = () => values() !== stored;

    async function save() {
      const triggers = parseJson(fields.triggers.value, 'triggers');
      const check = parseJson(fields.check.value, 'check');
      const errors = [triggers.error, check.error].filter(Boolean);
      if (errors.length) { say('error', 'Not saved.', errors); return false; }
      const changes = { kind: kind.value, title: fields.title.value, body: fields.body.value, not_derivable: fields.not_derivable.value,
        triggers: triggers.value ?? [], check: check.value ?? null };
      if (!m.check && changes.check === null) delete changes.check;
      return act('Save', memoryPath(id), changes, { method: 'PUT' });
    }

    const dryOut = h('div');
    async function dryRun() {
      const triggers = parseJson(fields.triggers.value, 'triggers');
      if (triggers.error) { say('error', 'Dry run not started.', [triggers.error]); return; }
      let result;
      try { result = await api(memoryAction(id, '/dry-run'), { method: 'POST', body: { triggers: triggers.value ?? [] } }); }
      catch (err) { refused('Dry run', err); return; }
      dryOut.replaceChildren(
        h('p', {}, `Would have fired in ${result.sessions} of ${result.scanned} recorded sessions.`),
        result.unjudged.map(note => h('div', { class: 'notice' }, `Not judged: ${note}`)),
        result.events.length ? h('table', {}, h('thead', {}, h('tr', {}, ['Session', 'At', 'Event', 'Paths', 'Via'].map(t => h('th', {}, t)))),
          h('tbody', {}, result.events.map(e => h('tr', {}, h('td', { class: 'mono' }, e.session), h('td', { class: 'mono' }, e.at ?? ''),
            h('td', {}, e.kind), h('td', { class: 'mono' }, e.paths.join(', ')), h('td', { class: 'mono' }, typeof e.via === 'string' ? e.via : JSON.stringify(e.via)))))) : null);
    }

    const stale = new Set(detail.stale);
    const pane = h('div', { class: 'pane' },
      h('div', {}, h('span', { class: 'badge' }, m.kind), h('span', { class: `badge${live ? ' good' : m.status === 'candidate' ? ' warn' : ''}` }, m.status),
        m.origin ? h('span', { class: 'badge' }, m.origin) : null),
      h('h2', {}, m.title),
      h('div', { class: 'mono' }, `${m.topic} · ${id}`),
      m.review?.issues?.length ? h('div', { class: 'notice' }, 'Review issues:', h('ul', {}, m.review.issues.map(i => h('li', { class: 'mono' }, i)))) : null,
      h('div', { class: 'row' }, topic, h('button', { type: 'button', class: 'act', on: { click: () => act('Re-topic', memoryAction(id, '/retopic'), { topic: topic.value }) } }, 'Re-topic')),
      h('label', { for: 'f-kind' }, 'Kind'), kind,
      h('label', { for: 'f-title' }, 'Title'), fields.title,
      h('label', { for: 'f-body' }, 'Body'), fields.body,
      h('label', { for: 'f-nd' }, 'Not derivable (why the code does not show this)'), fields.not_derivable,
      h('label', { for: 'f-triggers' }, 'Triggers (JSON)'), fields.triggers,
      h('label', { for: 'f-check' }, 'Check (JSON, empty for none)'), fields.check,
      m.check ? h('div', { class: `notice ${detail.check.problems.length ? 'error' : 'ok'}` },
        detail.check.problems.length ? ['The check\'s examples fail:', h('ul', {}, detail.check.problems.map(p => h('li', { class: 'mono' }, p)))]
          : 'The check\'s examples hold.') : null,

      detail.suggested_triggers.length ? [h('h3', {}, 'Suggested triggers'), h('pre', {}, pretty(detail.suggested_triggers)),
        h('div', { class: 'row' }, h('button', { type: 'button', class: 'act small', on: { click: () => {
          fields.triggers.value = pretty(detail.suggested_triggers); grow(fields.triggers);
        } } }, 'Use these (then save)'))] : null,

      h('h3', {}, 'Dry run over recorded sessions'),
      h('div', { class: 'row' }, h('button', { type: 'button', class: 'act small', on: { click: dryRun } }, 'Dry run the triggers above')),
      dryOut,

      h('h3', {}, 'Use'),
      h('p', {}, `Fired in ${detail.fired} of ${detail.opportunity} sessions with an opportunity.`,
        Object.keys(detail.by_dimension ?? {}).length ? ` By dimension: ${Object.entries(detail.by_dimension).map(([via, n]) => `${via} ${n}`).join(', ')}.` : ''),
      detail.signals.length ? h('ul', { class: 'plain' }, detail.signals.map(s => h('li', {}, h('span', { class: 'badge warn' }, s.signal),
        s.value !== undefined ? h('span', { class: 'mono' }, String(s.value)) : null))) : h('p', { class: 'mono' }, 'No health signal.'),

      h('h3', {}, 'Breadth'),
      detail.breadth.length ? h('ul', { class: 'plain' }, detail.breadth.map(b => h('li', {}, h('span', { class: 'mono' }, b.glob),
        h('span', { class: `badge${b.files ? '' : ' bad'}` }, `${b.files} file${b.files === 1 ? '' : 's'}`)))) : h('p', { class: 'mono' }, 'No path trigger.'),

      h('h3', {}, 'Evidence'),
      m.evidence.length ? h('ul', { class: 'plain' }, m.evidence.map(e => h('li', {}, h('span', { class: 'badge' }, e.type),
        e.path ? h('span', { class: 'mono' }, e.path) : null,
        e.path && stale.has(e.path) ? h('span', { class: 'badge bad' }, 'stale') : null,
        h('span', {}, e.summary ?? '')))) : h('p', { class: 'mono' }, 'No evidence.'),

      h('h3', {}, 'Similar memories'),
      detail.similar.length ? h('ul', { class: 'plain' }, detail.similar.map(s => h('li', {},
        h('span', {}, s.title ?? s.id), h('span', { class: 'mono' }, s.id),
        h('button', { type: 'button', class: 'act small', on: { click: () => openMemory(s.id) } }, 'Open'),
        h('button', { type: 'button', class: 'act small', on: { click: () => merge(s.id) } }, 'Merge this into it')))) : h('p', { class: 'mono' }, 'None found.'),

      h('h3', {}, 'Merge into another memory'),
      h('p', { class: 'mono' }, 'This memory is archived; the one kept stays as it is.'),
      h('div', { class: 'row' }, keep, h('button', { type: 'button', class: 'act', on: { click: () => merge(keep.value.trim()) } }, 'Merge into')));

    async function merge(keepId) {
      if (!keepId) { say('error', 'Merge needs the id of the memory to keep.'); return; }
      const ok = await act('Merge', '/api/merge', { keep: keepId, drop: id }, { after: 'clear' });
      if (ok) openMemory(keepId);
    }

    $('detail').replaceChildren(bar, pane);
  }

  // The project's settings (.dd/config.json), in a dialog over whatever is open: what DD reads,
  // changed in place; other keys are kept.
  async function showSettings() {
    let settings;
    try { settings = await api('/api/config'); } catch (err) { refused('Reading the settings', err); return; }
    const dialog = $('settings');
    const auto = h('input', { id: 's-auto', type: 'checkbox' });
    auto.checked = settings.auto_accept;
    const bounds = settings.limits.delivery_limit;
    const limit = h('input', { id: 's-limit', type: 'number', min: String(bounds.min), max: String(bounds.max), step: '500' });
    limit.value = String(settings.delivery_limit);
    const sessionsBounds = settings.limits.retire_after_sessions;
    const retire = h('input', { id: 's-retire', type: 'number', min: String(sessionsBounds.min), max: String(sessionsBounds.max), step: '1' });
    retire.value = String(settings.retire_after_sessions);
    async function save() {
      try { settings = await api('/api/config', { method: 'PUT', body: { auto_accept: auto.checked, delivery_limit: Number(limit.value), retire_after_sessions: Number(retire.value) } }); }
      catch (err) { refused('Saving the settings', err); return; }
      dialog.close();
      say('ok', `Auto-accept ${settings.auto_accept ? 'on' : 'off'}; delivery cap ${settings.delivery_limit} characters; retire after ${settings.retire_after_sessions} sessions.`);
      await loadOverview();
    }
    dialog.replaceChildren(
      h('div', { class: 'pane' },
        h('h2', { id: 'settings-title' }, 'Settings'),
        h('div', { class: 'mono' }, `.dd/config.json · project ${settings.project_id ?? '(no project_id)'}`),
        h('label', { for: 's-auto', class: 'check' }, auto, h('span', {}, 'Auto-accept: DD activates a proposal on its own when it verified the evidence itself, every trigger is live, it has no check and it duplicates or revises nothing. Off: every proposal waits as a candidate.')),
        h('label', { for: 's-limit' }, `Delivery cap, in characters (${bounds.min} to ${bounds.max}; default ${bounds.default})`), limit,
        h('p', { class: 'mono' }, 'What does not fit whole is named and arrives at its next event.'),
        h('label', { for: 's-retire' }, `Retire after, in sessions (${sessionsBounds.min} to ${sessionsBounds.max}; default ${sessionsBounds.default})`), retire,
        h('p', { class: 'mono' }, 'Maintenance archives a memory whose files that many sessions touched without it ever firing; never one a person reviewed. Other keys in the file are kept as they are.')),
      h('div', { class: 'actions' },
        h('button', { type: 'button', class: 'act', on: { click: () => dialog.close() } }, 'Cancel'),
        h('button', { type: 'button', class: 'act ok', on: { click: save } }, 'Save')));
    dialog.showModal();
    auto.focus();
  }

  function showCreate() {
    const f = {
      topic: h('input', { id: 'n-topic', type: 'text', placeholder: 'area/subject' }),
      kind: h('select', { id: 'n-kind' }, KINDS.map(k => h('option', { value: k }, k))),
      title: h('input', { id: 'n-title', type: 'text' }),
      body: textArea('n-body', ''),
      not_derivable: textArea('n-nd', ''),
      triggers: textArea('n-triggers', '[]', true),
      check: textArea('n-check', '', true),
    };
    async function create() {
      const triggers = parseJson(f.triggers.value, 'triggers');
      const check = parseJson(f.check.value, 'check');
      const errors = [triggers.error, check.error].filter(Boolean);
      if (errors.length) { say('error', 'Not created.', errors); return; }
      let created;
      try {
        created = await api('/api/memories', { method: 'POST', body: { topic: f.topic.value.trim(), kind: f.kind.value, title: f.title.value,
          body: f.body.value, not_derivable: f.not_derivable.value, triggers: triggers.value ?? [], ...(check.value ? { check: check.value } : {}) } });
      } catch (err) { refused('Create', err); return; }
      await loadOverview();
      await openAnywhere(created.id);
      say('ok', 'Created.');
    }
    $('view').replaceChildren(
      h('div', { class: 'bar' }, h('button', { type: 'button', class: 'act ok', on: { click: create } }, 'Create')),
      h('div', { class: 'pane' }, h('h2', {}, 'New memory'),
        h('label', { for: 'n-topic' }, 'Topic'), f.topic,
        h('label', { for: 'n-kind' }, 'Kind'), f.kind,
        h('label', { for: 'n-title' }, 'Title'), f.title,
        h('label', { for: 'n-body' }, 'Body'), f.body,
        h('label', { for: 'n-nd' }, 'Not derivable (why the code does not show this)'), f.not_derivable,
        h('label', { for: 'n-triggers' }, 'Triggers (JSON)'), f.triggers,
        h('label', { for: 'n-check' }, 'Check (JSON, empty for none)'), f.check));
    f.topic.focus();
  }

  // Live: the server says when the store changed (a hook saved a memory, the agent asked
  // something, a session was recorded); the page re-reads the counts and the open list or
  // dashboard. An open memory or a form being written is left as it is.
  let refreshing = false, again = false;
  async function refresh() {
    if (refreshing) { again = true; return; }
    refreshing = true;
    try {
      await loadOverview();
      if (state.queue === 'dashboard') await loadDashboard();
      else if (state.queue !== 'create') await loadList();
    } finally {
      refreshing = false;
      if (again) { again = false; refresh(); }
    }
  }
  function setLive(on) { if (state.live !== on) { state.live = on; renderNav(); } }
  function connectLive() {
    if (typeof EventSource === 'undefined') return;
    const source = new EventSource('/api/events');
    source.addEventListener('open', () => setLive(true));
    source.addEventListener('message', refresh);
    // EventSource reconnects on its own; until it does, the page says it is not live.
    source.addEventListener('error', () => setLive(false));
  }

  // Open on what waits for a person: candidates, else what the agent asked, else what DD
  // accepted on its own, else the dashboard.
  (async () => {
    await loadOverview();
    const queues = state.overview?.queues;
    const asked = location.hash.slice(1);
    const first = LABELS[asked] ? asked : !queues ? 'dashboard' : queues.candidates ? 'candidates' : queues.from_agent ? 'from_agent'
      : queues.auto_accepted ? 'auto_accepted' : 'dashboard';
    select(first);
    connectLive();
  })();
  </script>
</body>
