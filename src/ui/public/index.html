<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeltaDictum audit</title>
  <meta name="dd-review-token" content="__DD_REVIEW_TOKEN__" />
  <style>
    :root { color-scheme: dark light; --bg: #101014; --fg: #e8e8ea; --muted: #9a9aaa; --card: #1b1b22; --acc: #7c9cff; --danger: #ff6b6b; --ok: #6dd6a2; }
    body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    header { padding: 16px 20px; border-bottom: 1px solid #2a2a33; display: flex; gap: 12px; align-items: center; }
    h1 { font-size: 16px; margin: 0; }
    #status { color: var(--muted); }
    nav { display: flex; gap: 8px; }
    button, select { background: var(--card); color: var(--fg); border: 1px solid #333; border-radius: 6px; padding: 6px 10px; }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button.ok { border-color: var(--ok); color: var(--ok); }
    main { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 58px); }
    #list { border-right: 1px solid #2a2a33; overflow: auto; }
    .item { padding: 10px 14px; border-bottom: 1px solid #2a2a33; cursor: pointer; }
    .item:hover, .item.active { background: var(--card); }
    .item small { display: block; color: var(--muted); }
    #detail { padding: 20px; overflow: auto; }
    label { display: block; margin: 10px 0 4px; color: var(--muted); }
    input, textarea { width: 100%; box-sizing: border-box; background: var(--card); color: var(--fg); border: 1px solid #333; border-radius: 6px; padding: 8px; }
    textarea { min-height: 70px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .empty { padding: 40px; color: var(--muted); }
    .badge { font-size: 11px; padding: 2px 6px; border-radius: 999px; background: #2a2a33; }
    .unseen-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); margin-right: 6px; animation: dd-pulse 1.6s ease-in-out infinite; }
    @keyframes dd-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.4); } }
    .notice { padding: 12px; border-left: 3px solid var(--acc); background: var(--card); white-space: pre-wrap; }
    .warning { border-color: var(--danger); }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    #project { padding: 12px 20px; color: var(--muted); border-bottom: 1px solid #2a2a33; }
    #evidence { border-bottom: 1px solid #2a2a33; color: var(--muted); }
    #evidence > summary { padding: 12px 20px; cursor: pointer; }
    #evidence-list { max-height: 240px; overflow: auto; padding: 0 20px 12px; }
    .observation { padding: 8px 0; border-top: 1px solid #2a2a33; }
    .observation p { margin: 4px 0 0; color: var(--fg); overflow-wrap: anywhere; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } #list { max-height: 240px; } header { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <header>
    <h1>DeltaDictum</h1>
    <span id="status">loading…</span>
    <nav>
      <select id="filter">
        <option value="">all</option>
        <option value="candidate">candidates</option>
        <option value="active">active</option>
        <option value="contested">contested</option>
        <option value="rejected">rejected</option>
        <option value="superseded">superseded</option>
        <option value="archived">archived</option>
      </select>
      <select id="origin-filter" aria-label="Capture origin">
        <option value="">all origins</option>
        <option value="model_initiated">model initiative</option>
        <option value="user_explicit">explicit user request</option>
      </select>
      <select id="type-filter" aria-label="Memory type">
        <option value="">all types</option>
        <option value="lesson">lesson</option>
        <option value="anti_memory">anti-memory</option>
        <option value="procedure">procedure</option>
        <option value="decision">decision</option>
        <option value="claim">claim</option>
      </select>
      <label><input type="checkbox" id="unseen-only"> unseen only</label>
      <select id="sort-by" aria-label="Sort by">
        <option value="created_at">newest first</option>
        <option value="confidence">confidence</option>
        <option value="activation_count">most activated</option>
      </select>
      <button id="reload">Reload</button>
    </nav>
  </header>
  <div id="project"></div>
  <details id="auto-accept-settings">
    <summary>Auto-accept settings</summary>
    <label><input type="checkbox" id="auto-accept-enabled"> Auto-accept high-confidence candidates</label>
    <label>Confidence threshold <input type="number" id="auto-accept-threshold" min="0" max="1" step="0.05"></label>
  </details>
  <details id="evidence">
    <summary>Recorded evidence <span id="evidence-count"></span></summary>
    <div id="evidence-list"></div>
  </details>
  <main>
    <section id="list"></section>
    <section id="detail" class="empty">Select a memory.</section>
  </main>
  <script>
    const listEl = document.getElementById('list');
    const detailEl = document.getElementById('detail');
    const statusEl = document.getElementById('status');
    const filterEl = document.getElementById('filter');
    const originFilterEl = document.getElementById('origin-filter');
    const typeFilterEl = document.getElementById('type-filter');
    const unseenOnlyEl = document.getElementById('unseen-only');
    const sortByEl = document.getElementById('sort-by');
    const autoAcceptEnabledEl = document.getElementById('auto-accept-enabled');
    const autoAcceptThresholdEl = document.getElementById('auto-accept-threshold');
    let atoms = [];
    let selected = null;

    async function api(path, opts) {
      const res = await fetch(path, { ...opts, headers: { 'x-dd-review-token': document.querySelector('meta[name="dd-review-token"]').content, ...opts?.headers } });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    async function load() {
      const status = await api('/api/status');
      statusEl.textContent = `${status.project_id} · ${status.total} memories`;
      const project = await api('/api/project');
      document.getElementById('project').textContent = `${project.purpose || project.name} · Sources: ${project.sources.join(', ') || 'repository structure'}`;
      const q = new URLSearchParams();
      if (filterEl.value) q.set('lifecycle', filterEl.value);
      if (originFilterEl.value) q.set('capture_origin', originFilterEl.value);
      if (typeFilterEl.value) q.set('memory_type', typeFilterEl.value);
      await loadEvidence();
      atoms = await api('/api/atoms?' + q);
      if (unseenOnlyEl.checked) atoms = atoms.filter(a => !a.seen);
      const sortKey = sortByEl.value;
      atoms = atoms.slice().sort((a, b) => sortKey === 'created_at'
        ? new Date(b.created_at) - new Date(a.created_at) : (b[sortKey] ?? 0) - (a[sortKey] ?? 0));
      renderList();
      if (!atoms.length) {
        selected = null;
        detailEl.className = 'empty';
        detailEl.textContent = filterEl.value || originFilterEl.value ? 'No memories match these filters.' : 'No memories yet. Propose one from the agent, then admit it here.';
      } else if (selected) {
        const still = atoms.find(a => a.id === selected.id);
        if (still) await select(still.id);
        else { selected = null; detailEl.textContent = 'Select a memory.'; }
      }
    }

    // Read-only. An observation is evidence a proposal may cite, not knowledge,
    // so there is nothing here to approve: promotion happens on the memory that
    // cites it, with the reviewer able to see what was actually recorded.
    async function loadEvidence() {
      const observations = await api('/api/observations');
      document.getElementById('evidence-count').textContent = observations.length ? `· ${observations.length} recorded, read-only` : '· none recorded';
      document.getElementById('evidence-list').innerHTML = observations.map(o => `
        <div class="observation">
          <span class="badge">${escapeHtml(o.source_type)}</span>
          <small>${escapeHtml(o.source_ref)} · ${escapeHtml(o.observed_at)} · ${escapeHtml(o.metadata?.provenance ?? 'unknown')} · <code>${escapeHtml(o.id)}</code></small>
          <p>${escapeHtml(o.raw_preview)}</p>
        </div>`).join('') || '<p>Nothing observed yet. Failures, validation commands and user corrections appear here.</p>';
    }

    function renderList() {
      listEl.innerHTML = atoms.map(atom => `
        <div class="item ${selected && selected.id === atom.id ? 'active' : ''}" data-id="${escapeHtml(atom.id)}">
          ${atom.seen ? '' : '<span class="unseen-dot" aria-label="not yet reviewed"></span>'}<strong>${escapeHtml(atom.title)}</strong>
          <small><span class="badge">${escapeHtml(atom.lifecycle_state)}</span> ${escapeHtml(atom.topic_key)}</small>
          <small>${escapeHtml(captureLabel(atom))}</small>
        </div>
      `).join('');
    }

    function field(name, value, area) {
      const labels = { topic_key: 'Topic', trigger: 'When this applies', behavior_delta: 'Recommended action', why: 'Rationale', trigger_variants: 'Other ways this situation is described (one per line)',
        applies_to: 'File, component and operation scope', assumptions: 'Assumptions', revisit_when: 'When to reconsider', alternatives: 'Alternatives considered',
        evidence_refs: 'Evidence references', review_rationale: 'Your review rationale', loser_id: 'Conflicting memory to supersede' };
      const label = labels[name] || name;
      if (area) {
        return `<label for="field-${name}">${label}</label><textarea id="field-${name}" name="${name}">${escapeHtml(value ?? '')}</textarea>`;
      }
      return `<label for="field-${name}">${label}</label><input name="${name}" value="${escapeHtml(value ?? '')}" id="field-${name}" />`;
    }

    function captureLabel(atom) {
      const origin = { model_initiated: 'Model initiative', user_explicit: 'Explicit user request' }[atom.capture_origin ?? 'user_explicit'] || 'Unknown origin';
      const source = { agent: 'agent reported', local_ui: 'local UI' }[atom.capture_source];
      return source ? `${origin} · ${source}` : origin;
    }

    async function select(id) {
      selected = await api('/api/atoms/' + encodeURIComponent(id));
      const outcomes = await api('/api/feedback?atom=' + encodeURIComponent(id));
      detailEl.className = '';
      detailEl.innerHTML = `
        <p><span class="badge">${escapeHtml(selected.lifecycle_state)}</span> <span class="badge">${escapeHtml(selected.memory_type)}</span> ${escapeHtml(selected.id)}</p>
        <p>Capture: ${escapeHtml(captureLabel(selected))}. Approval is recorded separately.</p>
        ${selected.lifecycle_state === 'candidate' && selected.replaces ? `<p class="notice">Pending replacement of ${escapeHtml(selected.replaces)}. The current decision stays effective until approval.</p>` : ''}
        ${selected.lifecycle_state === 'candidate' && selected.suspected_pair?.length ? `<p class="notice warning">Suspected duplicate of ${selected.suspected_pair.map(escapeHtml).join(', ')}. Read both before approving: approving this adds a second memory on the same trigger.</p>` : ''}
        ${selected.freshness.length ? `<p class="notice warning">Review required: ${escapeHtml(selected.freshness.join('; '))}</p>` : ''}
        ${selected.lifecycle_state === 'contested' ? '<p class="notice warning">Disputed knowledge. Inspect the conflicting memory before choosing a winner.</p>' : ''}
        ${selected.lifecycle_state === 'archived' ? `<p class="notice">Retired by disuse${selected.archived_at ? ' on ' + escapeHtml(selected.archived_at) : ''}: its trigger had chances to fire and never did. Nothing was deleted. Restoring makes it retrievable again, unless another memory has taken its topic since.</p>` : ''}
        ${field('title', selected.title)}
        ${field('topic_key', selected.topic_key)}
        ${field('trigger', selected.trigger, true)}
        ${field('behavior_delta', selected.behavior_delta, true)}
        ${field('why', selected.why, true)}
        ${field('trigger_variants', (selected.trigger_variants || []).join('\n'), true)}
        ${field('applies_to', JSON.stringify(selected.applies_to || {}, null, 2), true)}
        ${field('assumptions', JSON.stringify(selected.assumptions || [], null, 2), true)}
        ${field('revisit_when', JSON.stringify(selected.revisit_when || [], null, 2), true)}
        ${field('alternatives', JSON.stringify(selected.alternatives || [], null, 2), true)}
        ${field('evidence_refs', JSON.stringify(selected.evidence_refs || [], null, 2), true)}
        <details open><summary>Evidence and review</summary><pre>${escapeHtml(JSON.stringify({ evidence: selected.evidence_state || selected.evidence_refs, review: selected.review }, null, 2))}</pre></details>
        <details><summary>Derived compact forms</summary><pre>${escapeHtml(JSON.stringify(selected.retrieval_forms, null, 2))}</pre></details>
        <details open><summary>Task outcomes (${outcomes.length})</summary>${outcomes.map(o => `<p>${escapeHtml(o.outcome)} · ${escapeHtml(o.summary)} · ${escapeHtml(o.verification)} <button data-feedback="${escapeHtml(o.id)}" data-accept="true">Accept evidence</button> <button data-feedback="${escapeHtml(o.id)}" data-accept="false">Dismiss report</button></p>`).join('')}</details>
        ${field('review_rationale', '', true)}
        <small>Explain why the evidence supports this decision. Saving edits creates a new proposal.</small>
        ${selected.lifecycle_state === 'candidate' ? `<label for="field-review_authority">Authority to grant</label>
        <select id="field-review_authority" name="review_authority">
          <option value="validated" selected>validated — accept the ceiling this memory's source earns</option>
          <option value="canonical">canonical — lift the source ceiling; this is your decision, not the evidence's</option>
        </select>
        <small>Source reliability caps confidence. Granting canonical is the only review action that lifts that cap.</small>` : ''}
        ${selected.lifecycle_state === 'contested' ? `<label for="field-loser_id">Conflicting decision to supersede</label><select id="field-loser_id" name="loser_id">${selected.opponents.map(a => `<option value="${escapeHtml(a.id)}">${escapeHtml(a.topic_key)} · ${escapeHtml(a.title)}</option>`).join('')}</select><button data-act="inspect-opponent">Inspect selected conflict</button>` : ''}
        <div class="row">
          ${selected.lifecycle_state === 'candidate' ? '<button class="ok" data-act="admit">Admit</button><button class="danger" data-act="reject">Reject</button>' : ''}
          <button data-act="save">Save</button>
          ${selected.lifecycle_state === 'contested' ? '<button class="ok" data-act="resolve">Keep this decision and supersede the other</button>' : ''}
          ${selected.lifecycle_state === 'archived' ? '<button class="ok" data-act="restore">Restore</button>' : ''}
          <button class="danger" data-act="delete">Delete</button>
        </div>
        <p id="msg"></p>
      `;
      renderList();
    }

    function formValues() {
      const data = {};
      detailEl.querySelectorAll('input, textarea').forEach(el => { data[el.name] = el.value; });
      for (const key of ['applies_to', 'assumptions', 'revisit_when', 'alternatives', 'evidence_refs']) data[key] = JSON.parse(data[key]);
      data.trigger_variants = data.trigger_variants.split('\n').filter(Boolean);
      delete data.review_rationale; delete data.loser_id;
      return data;
    }

    detailEl.addEventListener('click', async (ev) => {
      if (ev.target.dataset.feedback) {
        try {
          await api('/api/feedback/review', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: ev.target.dataset.feedback, accepted: ev.target.dataset.accept === 'true' }) });
          return await select(selected.id);
        } catch (err) { document.getElementById('msg').textContent = err.message; return; }
      }
      const act = ev.target.dataset.act;
      if (!act || !selected) return;
      const msg = document.getElementById('msg');
      try {
        if (act === 'save') {
          const proposal = await api('/api/atoms/' + encodeURIComponent(selected.id), {
            method: 'PATCH',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(formValues()),
          });
          if (!['write', 'update'].includes(proposal.decision) || !proposal.atom) throw new Error((proposal.reasons || ['No new proposal was created.']).join('; '));
          selected = proposal.atom;
          // An edit can collide with a memory on another topic, which makes the
          // saved proposal a revision of it rather than a new sibling.
          msg.textContent = proposal.decision === 'update'
            ? 'Proposal saved for review as a revision of ' + proposal.atom.replaces + '.'
            : 'Proposal saved for review.';
        } else if (act === 'admit') {
          await api('/api/atoms/' + encodeURIComponent(selected.id) + '/admit', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({
            rationale: detailEl.querySelector('[name="review_rationale"]').value,
            authority: detailEl.querySelector('[name="review_authority"]').value }) });
        } else if (act === 'reject') {
          await api('/api/atoms/' + encodeURIComponent(selected.id) + '/reject', { method: 'POST' });
        } else if (act === 'restore') {
          await api('/api/atoms/' + encodeURIComponent(selected.id) + '/restore', { method: 'POST' });
        } else if (act === 'delete') {
          if (!confirm('Delete this memory version?')) return;
          await api('/api/atoms/' + encodeURIComponent(selected.id), { method: 'DELETE', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ confirm: true }) });
          selected = null;
        } else if (act === 'resolve') {
          await api('/api/resolve', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ winner_id: selected.id, loser_id: detailEl.querySelector('[name="loser_id"]').value, rationale: detailEl.querySelector('[name="review_rationale"]').value }) });
        } else if (act === 'inspect-opponent') {
          return await select(detailEl.querySelector('[name="loser_id"]').value);
        }
        await load();
      } catch (err) {
        msg.textContent = err.message;
      }
    });

    listEl.addEventListener('click', (ev) => {
      const item = ev.target.closest('.item');
      if (item) select(item.dataset.id);
    });
    filterEl.addEventListener('change', load);
    originFilterEl.addEventListener('change', load);
    typeFilterEl.addEventListener('change', load);
    unseenOnlyEl.addEventListener('change', load);
    sortByEl.addEventListener('change', load);
    document.getElementById('reload').addEventListener('click', load);
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }
    async function loadAutoAcceptConfig() {
      const { auto_accept } = await api('/api/config');
      autoAcceptEnabledEl.checked = auto_accept.enabled;
      autoAcceptThresholdEl.value = auto_accept.confidence_threshold;
    }
    async function saveAutoAcceptConfig() {
      await api('/api/config/auto-accept', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ enabled: autoAcceptEnabledEl.checked, confidence_threshold: Number(autoAcceptThresholdEl.value) }) });
    }
    autoAcceptEnabledEl.addEventListener('change', saveAutoAcceptConfig);
    autoAcceptThresholdEl.addEventListener('change', saveAutoAcceptConfig);
    load();
    loadAutoAcceptConfig();
  </script>
</body>
</html>
